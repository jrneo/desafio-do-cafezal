<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 620 200"
     role="img"
     aria-label="Desafio do Cafezal — Manejo de Cafezais em Produção">
  <title>Desafio do Cafezal — Manejo de Cafezais em Produção</title>

  <!-- Ícone à esquerda -->
  <g transform="translate(100 100)">
    <circle cx="0" cy="0" r="78" fill="#f5efe0"/>
    <circle cx="0" cy="0" r="78" fill="none"
            stroke="#2f5d3a" stroke-width="4"/>

    <!-- Folha -->
    <g transform="translate(0 -18)">
      <path d="M 0 -20 C 13 -15, 20 3, 10 17
               C 0 9, -7 -6, 0 -20 Z"
            fill="#4a8b3f"/>
      <path d="M 0 -20 Q 6 -3, 10 17"
            stroke="#2f5d3a" stroke-width="2"
            fill="none" stroke-linecap="round"/>
    </g>

    <!-- Grão de café -->
    <g transform="translate(0 26) rotate(-18)">
      <ellipse cx="0" cy="0" rx="24" ry="17" fill="#6b4423"/>
      <path d="M -18 0 Q -8 -8, 0 0 T 18 0"
            stroke="#f5efe0" stroke-width="3.5"
            fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Tipografia -->
  <g font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="210" y="94"
          font-size="46"
          font-weight="800"
          fill="#2f5d3a"
          letter-spacing="-0.5">
      Desafio do Cafezal
    </text>
    <text x="210" y="130"
          font-size="21"
          font-weight="500"
          fill="#6b4423"
          letter-spacing="0.4">
      Manejo de Cafezais em Produção
    </text>
    <line x1="210" y1="146" x2="580" y2="146"
          stroke="#c9a227" stroke-width="3" stroke-linecap="round"/>
    <text x="210" y="176"
          font-size="14"
          fill="#8a7860"
          letter-spacing="2">
      EMATER-MG · LIVRO DIGITAL INTERATIVO
    </text>
  </g>
</svg>